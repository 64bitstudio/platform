# Ticket 001 (platform): este job es el `sync-vm-infra` que vivía en
# `auth-core-mc/.github/workflows/ci.yml` (tickets 049/050 de ese repo,
# ver su docs/ARQUITECTURA.md para la historia técnica completa de cada
# pieza — no se repite aquí) — movido a este repo porque es infra
# COMPARTIDA de la VM, no específica de un core. `auth-core-mc` retiró
# ese job (y su ci.yml completo, ver el commit que lo retira) en el mismo
# ticket que trajo este archivo aquí. Motivación completa en
# docs/ARQUITECTURA.md de este repo y en la memoria del equipo
# `saas-paas-cores-strategy`.
#
# Qué se dejó FUERA a propósito al migrar (se queda en auth-core-mc, no
# es infra compartida): el vhost `nginx/auth-core-mc.conf` y el
# certificado Let's Encrypt de auth.64bitstudio.com/auth-qa/auth-dev —
# específicos de ese core. Consecuencia real y documentada (no un
# descuido): con el ci.yml de auth-core-mc retirado por completo, ese
# vhost/certificado ya no tiene ningún job que lo vuelva a aplicar si
# cambiara o si la VM se reconstruyera desde cero — sí sigue
# renovándose solo (certbot.timer del sistema, verificado activo en la
# VM), pero un cambio de contenido del vhost necesitaría reintroducir
# algún mecanismo (mismo patrón aquí, o un paso en el Jenkinsfile) en un
# ticket futuro si hace falta. Ver docs/ARQUITECTURA.md.
#
# `paths-ignore: ['docs/**']` (nuevo respecto al original): regla de
# este repo (`done/000-directiva-documentacion-y-flujo-de-tareas.md`) —
# un push que solo toca documentación nunca dispara CI/CD real.
name: Infra Sync (VM)

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"

jobs:
  # Asegura la infra compartida de la VM (red `edge`, Traefik, SonarQube,
  # Jenkins, Portainer, certificados, firewall) en CUALQUIER push (que no
  # sea solo de docs/), a cualquier rama. Idempotente ("docker compose up
  # -d"/"docker network create" no hacen nada si ya existen) — seguro de
  # correr en cada push, no solo la primera vez.
  sync-vm-infra:
    runs-on: [self-hosted, vm-oci]
    steps:
      - uses: actions/checkout@v4

      - name: Red compartida "edge" (Traefik <-> stacks de cada proyecto)
        run: docker network inspect edge >/dev/null 2>&1 || docker network create edge

      # Red interna, SIN tráfico público -- solo para que Jenkins alcance
      # a SonarQube por nombre de contenedor ("sonarqube:9000"), no vía
      # Traefik.
      - name: Red compartida "vm-infra" (Jenkins <-> SonarQube)
        run: docker network inspect vm-infra >/dev/null 2>&1 || docker network create vm-infra

      - name: Traefik (ingress compartido de la VM, puertas adentro)
        run: docker compose -f deploy/vm-infra/traefik/docker-compose.yml up -d

      # Mismo patrón que el vhost de auth-core-mc (que se quedó en ese
      # repo) -- este es el vhost de Jenkins, infra compartida.
      - name: nginx -> Traefik (vhost de Jenkins)
        run: |
          sudo cp deploy/vm-infra/nginx/jenkins.conf /etc/nginx/sites-available/jenkins.conf
          sudo ln -sf /etc/nginx/sites-available/jenkins.conf /etc/nginx/sites-enabled/jenkins.conf
          sudo nginx -t
          sudo systemctl reload nginx

      # Basic Auth compartido de nginx para sonarqube/traefik/
      # portainer.64bitstudio.com -- hash apr1 (formato que entiende
      # auth_basic_user_file de nginx, sin depender del paquete
      # apache2-utils/htpasswd, no instalado en esta VM). Bootstrap
      # idempotente (nunca pisa un hash ya generado) -- debe correr ANTES
      # del paso de abajo que copia el vhost, porque "nginx -t" falla si
      # auth_basic_user_file no existe todavía. Deliberadamente NO bajo
      # /home/ubuntu/secrets/: ese árbol solo es legible por Docker vía
      # bind-mount con el UID/GID de cada contenedor (ver "Permisos de
      # grupo..." más abajo) -- nginx corre como el usuario de sistema
      # "www-data" sin membresía en el grupo "ubuntu" y sin traversal a
      # /home/ubuntu (permisos 750). /etc/nginx/secrets/ es el árbol
      # nativo que nginx ya puede leer (root:root, patrón estándar de
      # htpasswd, mundo-legible en 644 -- es un hash, no la contraseña en
      # claro).
      - name: Asegurar Basic Auth compartido de nginx (.htpasswd) si falta
        run: |
          sudo mkdir -p /etc/nginx/secrets
          sudo chmod 755 /etc/nginx/secrets
          FILE=/etc/nginx/secrets/vm-admin-tools.htpasswd
          if [ ! -f "$FILE" ]; then
            PW=$(openssl rand -base64 24 | tr -d '=+/\n')
            HASH=$(openssl passwd -apr1 "$PW")
            printf "admin:%s\n" "$HASH" | sudo tee "$FILE" > /dev/null
            sudo chmod 644 "$FILE"
            sudo chown root:root "$FILE"
            echo "Creado $FILE (usuario 'admin', password generado, no impreso) -- Marco debe pedirlo a quien lo generó si lo perdió."
          fi

      # Vhost con los 3 subdominios de infra privilegiada (SonarQube,
      # dashboard de Traefik, Portainer), detrás de Basic Auth. Depende
      # del paso anterior (el .htpasswd debe existir antes de "nginx -t").
      - name: nginx -> Traefik (vhost de las 3 herramientas de infra + Basic Auth)
        run: |
          sudo cp deploy/vm-infra/nginx/vm-admin-tools.conf /etc/nginx/sites-available/vm-admin-tools.conf
          sudo ln -sf /etc/nginx/sites-available/vm-admin-tools.conf /etc/nginx/sites-enabled/vm-admin-tools.conf
          sudo nginx -t
          sudo systemctl reload nginx

      # Hallazgo real (heredado de auth-core-mc): el firewall local de la
      # VM (iptables, persistido con iptables-persistent/
      # netfilter-persistent) solo tenía reglas ACCEPT explícitas para 22
      # (SSH), 25 (SMTP de mail-core-mc) y 80 (HTTP) -- con un REJECT
      # catch-all al final. Se agrega la regla justo antes del REJECT
      # (nunca al final) y se persiste para que sobreviva un reinicio.
      # Idempotente: no duplica la regla si ya existe.
      - name: Abrir 443/tcp en el firewall de la VM (para Traefik/nginx HTTPS)
        run: |
          if ! sudo iptables -C INPUT -p tcp --dport 443 -j ACCEPT 2>/dev/null; then
            REJECT_LINE=$(sudo iptables -L INPUT --line-numbers | awk '/REJECT/{print $1; exit}')
            sudo iptables -I INPUT "$REJECT_LINE" -p tcp --dport 443 -j ACCEPT
            sudo netfilter-persistent save
          fi

      # Certificado Let's Encrypt para Jenkins -- petición propia (certbot
      # exige que TODOS los SAN de una misma petición resuelvan).
      # Idempotente.
      - name: Certificado Let's Encrypt para Jenkins
        continue-on-error: true
        run: |
          if ! command -v certbot >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y certbot python3-certbot-nginx
          fi
          sudo certbot --nginx --non-interactive --agree-tos \
            -m marco.cortes@64bitstudio.com \
            -d jenkins.64bitstudio.com \
            --redirect

      # Certificado Let's Encrypt para las 3 herramientas de infra
      # privilegiada -- petición propia, mismo motivo que el de Jenkins.
      # continue-on-error: true por si el DNS de alguno de los 3 todavía
      # no propagó del todo cuando corre este paso. Idempotente.
      - name: Certificado Let's Encrypt para las 3 herramientas de infra
        continue-on-error: true
        run: |
          sudo certbot --nginx --non-interactive --agree-tos \
            -m marco.cortes@64bitstudio.com \
            -d sonarqube.64bitstudio.com \
            -d traefik.64bitstudio.com \
            -d portainer.64bitstudio.com \
            --redirect

      - name: SonarQube (compartido de la VM)
        run: docker compose -f deploy/vm-infra/sonarqube/docker-compose.yml up -d

      # Dashboard web de Docker/Compose, compartido de la VM (no
      # específico de ningún core). Ver
      # deploy/vm-infra/portainer/docker-compose.yml para el riesgo
      # aceptado de docker.sock (mismo ya documentado para Jenkins).
      - name: Portainer (dashboard de Docker/Compose, compartido de la VM)
        run: docker compose -f deploy/vm-infra/portainer/docker-compose.yml up -d

      # Ticket 003 (docs/definiciones/vault-secrets-manager-vm.md): Vault
      # Community Edition, fuente única de secretos de infra + motor
      # Transit -- compartido de la VM, mismo patrón idempotente que
      # SonarQube/Portainer arriba (imagen oficial, sin build propio, "up
      # -d" no hace nada si no cambió nada real). Requiere que el Dynamic
      # Group + Policy de OCI IAM ya existan (ver docs/ARQUITECTURA.md,
      # "Vault -- OCI KMS auto-unseal") -- si no existen todavía, el
      # contenedor arranca pero queda en crash-loop esperando poder
      # autenticarse contra OCI KMS (falla explícito en sus logs, nunca
      # en silencio) hasta que Marco los cree.
      - name: Vault (secrets manager compartido de la VM)
        run: docker compose -f deploy/vm-infra/vault/docker-compose.yml up -d

      # Ticket 004 (HU-8): el propio sync-vm-infra, que ya corre en cada
      # push, verifica el sello de Vault y dispara una alerta de
      # Telegram DEDICADA (distinta de la notificación genérica de
      # éxito/fallo del pipeline al final) -- con contexto suficiente
      # para actuar sin investigar desde cero. No falla el job (Vault
      # sellado no debe tumbar el resto de la infra compartida) -- los
      # pasos que sí dependen de Vault más abajo ya se omiten solos con
      # su propio aviso si esto pasa.
      - name: Verificar sello de Vault + alertar por Telegram si está sellado/inalcanzable (HU-8)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          HEALTH=$(docker exec vault vault status -format=json 2>/dev/null || echo "")
          SEALED=$(echo "$HEALTH" | python3 -c "import json,sys; print(json.load(sys.stdin).get('sealed', True))" 2>/dev/null || echo "unreachable")
          if [ "$SEALED" = "False" ]; then
            echo "Vault desellado y respondiendo -- OK."
          else
            echo "::warning::Vault sellado o inalcanzable (estado: $SEALED)."
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ]; then
              MSG=$(printf '*🔒 [platform] Vault sellado o inalcanzable*\nDetectado en sync-vm-infra (push a %s, %s).\nEstado crudo: %s\nAcción: revisar `docker exec vault vault status` en la VM -- si el auto-unseal vía OCI KMS falló, desellar a mano con las recovery keys del gestor de contraseñas de Marco (ver docs/ARQUITECTURA.md, ticket 003, HU-2).\nLos pasos de Transit/secretos de Jenkins que dependen de Vault se omitieron solos en esta corrida, sin tumbar el resto de sync-vm-infra.' "${{ github.ref_name }}" "${{ github.sha }}" "$SEALED")
              # Hallazgo real (ticket 004): un "curl" sin -f y sin revisar
              # la respuesta siempre termina en exit 0 aunque Telegram
              # responda 404 (p.ej. bot token vacío) -- así es como las
              # notificaciones de este mismo archivo llevaban rotas en
              # silencio desde el ticket 001 (ver docs/ARQUITECTURA.md,
              # sección HU-8, para el detalle completo). Se revisa el
              # código HTTP real Y el campo "ok" del cuerpo de respuesta
              # de la API de Telegram -- cualquiera de los dos que falle
              # hace fallar este step de verdad, visible en el run.
              RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                -d "chat_id=${TELEGRAM_CHAT_ID}" \
                -d "parse_mode=Markdown" \
                --data-urlencode "text=$MSG")
              HTTP_CODE=$(echo "$RESPONSE" | tail -1)
              BODY=$(echo "$RESPONSE" | sed '$d')
              OK=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('ok', False))" 2>/dev/null || echo "False")
              if [ "$HTTP_CODE" != "200" ] || [ "$OK" != "True" ]; then
                echo "::error::No se pudo entregar la alerta de Telegram de HU-8 (HTTP $HTTP_CODE): $BODY"
                exit 1
              fi
              echo "Alerta de Telegram (Vault sellado) entregada de verdad (HTTP $HTTP_CODE)."
            fi
          fi

      # Ticket 003/004: motor Transit + la llave que auth-core-mc ya
      # espera (VAULT_TRANSIT_KEY_NAME), como paso idempotente de CI en
      # vez de un comando manual que solo "corrió una vez". Usa el
      # AppRole "platform-admin" (ver docs/ARQUITECTURA.md, ticket 004)
      # -- ya NO el token root (borrado por Marco tras el bootstrap
      # inicial, por diseño). Si el AppRole platform-admin no existe
      # todavía (Vault recién reconstruido, antes de correr
      # bootstrap-admin-approle.sh), o Vault sigue sellado, el paso se
      # omite con un aviso explícito, nunca falla en silencio ni
      # bloquea el resto de sync-vm-infra.
      - name: Asegurar motor Transit + llave auth-core-mc-tenant-keys en Vault (si falta)
        run: |
          ROLE_ID_FILE=/home/ubuntu/secrets/vault/platform-admin-role-id
          SECRET_ID_FILE=/home/ubuntu/secrets/vault/platform-admin-secret-id
          if [ ! -f "$ROLE_ID_FILE" ] || [ ! -f "$SECRET_ID_FILE" ]; then
            echo "::warning::AppRole platform-admin no existe todavía (ver deploy/vm-infra/vault/bootstrap-admin-approle.sh). Se omite este paso."
            exit 0
          fi
          LOGIN_OUT=$(docker exec vault vault write -format=json auth/approle/login \
            role_id="$(cat "$ROLE_ID_FILE")" secret_id="$(cat "$SECRET_ID_FILE")" 2>/dev/null || echo "")
          TOKEN=$(echo "$LOGIN_OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['auth']['client_token'])" 2>/dev/null || echo "")
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            echo "::warning::No se pudo autenticar contra Vault (¿sigue sellado?) -- se omite este paso."
            exit 0
          fi
          if docker exec -e VAULT_TOKEN="$TOKEN" vault vault secrets list -format=json | python3 -c "import json,sys; exit(0 if 'transit/' in json.load(sys.stdin) else 1)"; then
            echo "transit ya estaba habilitado."
          else
            docker exec -e VAULT_TOKEN="$TOKEN" vault vault secrets enable transit
          fi
          if docker exec -e VAULT_TOKEN="$TOKEN" vault vault read transit/keys/auth-core-mc-tenant-keys >/dev/null 2>&1; then
            echo "la llave auth-core-mc-tenant-keys ya existía."
          else
            docker exec -e VAULT_TOKEN="$TOKEN" vault vault write -f transit/keys/auth-core-mc-tenant-keys
          fi

      # Ticket 004 (HU-1 completa): re-sincroniza el hash de Basic Auth
      # de nginx DESDE Vault (fuente de verdad desde la migración de
      # este ticket) -- corre DESPUÉS de que Vault ya está arriba (el
      # paso original de arriba, "Asegurar Basic Auth...", corre antes
      # de Vault por dependencia de orden con el vhost, así que sigue
      # existiendo tal cual como bootstrap de PRIMERA VEZ; este paso es
      # el que hace la rotación real funcionar después). Solo recarga
      # nginx si el valor realmente cambió -- evita reloads
      # innecesarios en cada push.
      - name: Sincronizar htpasswd de nginx desde Vault (si Vault lo tiene)
        run: |
          ROLE_ID_FILE=/home/ubuntu/secrets/vault/platform-admin-role-id
          SECRET_ID_FILE=/home/ubuntu/secrets/vault/platform-admin-secret-id
          if [ ! -f "$ROLE_ID_FILE" ] || [ ! -f "$SECRET_ID_FILE" ]; then
            echo "AppRole platform-admin no existe todavía -- se omite (el archivo local generado por el bootstrap sigue siendo la fuente por ahora)."
            exit 0
          fi
          LOGIN_OUT=$(docker exec vault vault write -format=json auth/approle/login \
            role_id="$(cat "$ROLE_ID_FILE")" secret_id="$(cat "$SECRET_ID_FILE")" 2>/dev/null || echo "")
          TOKEN=$(echo "$LOGIN_OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['auth']['client_token'])" 2>/dev/null || echo "")
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            echo "Vault no alcanzable -- se omite, el archivo local existente queda intacto (rollback real, HU-4)."
            exit 0
          fi
          VAULT_VALUE=$(docker exec -e VAULT_TOKEN="$TOKEN" vault vault kv get -field=htpasswd secret/nginx/basic-auth 2>/dev/null || echo "")
          if [ -n "$VAULT_VALUE" ]; then echo "::add-mask::$VAULT_VALUE"; fi
          if [ -z "$VAULT_VALUE" ]; then
            echo "secret/nginx/basic-auth no existe todavía en Vault -- se omite (nada que migrar aún)."
            exit 0
          fi
          FILE=/etc/nginx/secrets/vm-admin-tools.htpasswd
          CURRENT_VALUE=$(sudo cat "$FILE" 2>/dev/null || echo "")
          if [ "$VAULT_VALUE" = "$CURRENT_VALUE" ]; then
            echo "htpasswd ya coincide con Vault -- sin cambios."
          else
            echo "$VAULT_VALUE" | sudo tee "$FILE" > /dev/null
            sudo chmod 644 "$FILE"
            sudo chown root:root "$FILE"
            sudo nginx -t && sudo systemctl reload nginx
            echo "htpasswd actualizado desde Vault y nginx recargado."
          fi

      # Bootstrap idempotente de /home/ubuntu/secrets/jenkins/.env (nunca
      # lo pisa si ya existe con un password real puesto por Marco).
      - name: Asegurar /home/ubuntu/secrets/jenkins/.env (si falta)
        run: |
          mkdir -p /home/ubuntu/secrets/jenkins
          ENVFILE=/home/ubuntu/secrets/jenkins/.env
          if [ ! -f "$ENVFILE" ]; then
            PW=$(openssl rand -base64 24 | tr -d '=+/\n')
            sed "s#^JENKINS_ADMIN_PASSWORD=.*#JENKINS_ADMIN_PASSWORD=${PW}#" deploy/vm-infra/jenkins/.env.example > "$ENVFILE"
            chmod 600 "$ENVFILE"
            echo "Creado $ENVFILE (password generado, no impreso). GITHUB_PAT queda vacío -- Marco debe llenarlo a mano."
          fi

      # Ticket 006 -- hallazgo real (encontrado verificando de punta a
      # punta, no solo revisando código): TELEGRAM_BOT_TOKEN/CHAT_ID en
      # secret/jenkins llevaban en blanco (longitud 0, campo presente
      # pero vacío) a pesar de que el cierre del ticket 004 reportó
      # haberlos migrado. Causa raíz más probable (ver
      # docs/ARQUITECTURA.md ticket 006 para el detalle completo):
      # deploy/vm-infra/vault/migrate-infra-secrets.sh hace un
      # "vault kv put secret/jenkins" -- un REEMPLAZO COMPLETO del path,
      # no un merge -- con solo 4 campos codeados a mano (GITHUB_PAT,
      # SONAR_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID), leyendo sus
      # valores del .env LOCAL de la VM en ese momento. Si ese script se
      # re-corrió en algún punto posterior (p.ej. durante el propio
      # ticket 006, para "refrescar" secretos) con TELEGRAM_BOT_TOKEN/
      # CHAT_ID en blanco en el .env local (nada los llena ahí
      # automáticamente -- ci.yml los consume directo de
      # `secrets.TELEGRAM_*` para sus propias notificaciones, nunca los
      # escribe de vuelta al .env), ese "put" completo sobreescribió
      # secret/jenkins ENTERO con esos 2 campos en blanco. El propio
      # comentario del script ("seguro de re-correr") es la causa
      # raíz del riesgo -- ya NO es seguro desde que secret/jenkins
      # creció a más campos que los 4 que el script conoce (GITHUB_APP_ID,
      # GITHUB_APP_PRIVATE_KEY) -- corregido en el script (usa
      # "kv patch" ahora, ver ese archivo).
      #
      # Este paso se auto-repara: si Vault tiene esos 2 campos vacíos Y
      # ya existen como GitHub Actions Secrets de este repo (ya
      # confirmados reales -- son los mismos que usan los pasos
      # "Verificar sello de Vault"/"Notify success"/"Notify failure" de
      # este mismo archivo), los restaura con un merge real (lee
      # secret/jenkins completo, solo reemplaza esos 2 campos, escribe
      # de vuelta) -- nunca pide credenciales nuevas, nunca pisa ningún
      # otro campo (GITHUB_PAT/SONAR_TOKEN/GITHUB_APP_ID/
      # GITHUB_APP_PRIVATE_KEY quedan intactos).
      - name: Auto-reparar TELEGRAM_BOT_TOKEN/CHAT_ID de Jenkins en Vault si están vacíos (ticket 006)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ROLE_ID_FILE=/home/ubuntu/secrets/vault/platform-admin-role-id
          SECRET_ID_FILE=/home/ubuntu/secrets/vault/platform-admin-secret-id
          if [ ! -f "$ROLE_ID_FILE" ] || [ ! -f "$SECRET_ID_FILE" ]; then
            echo "::warning::AppRole platform-admin no existe todavía -- se omite este paso."
            exit 0
          fi
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID no están configurados como GitHub Actions Secrets de este repo todavía -- se omite este paso (nada que restaurar)."
            exit 0
          fi
          LOGIN_OUT=$(docker exec vault vault write -format=json auth/approle/login \
            role_id="$(cat "$ROLE_ID_FILE")" secret_id="$(cat "$SECRET_ID_FILE")" 2>/dev/null || echo "")
          TOKEN=$(echo "$LOGIN_OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['auth']['client_token'])" 2>/dev/null || echo "")
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            echo "::warning::No se pudo autenticar contra Vault (¿sigue sellado?) -- se omite este paso."
            exit 0
          fi
          CURRENT_JSON=$(docker exec -e VAULT_TOKEN="$TOKEN" vault vault kv get -format=json secret/jenkins 2>/dev/null || echo '{"data":{"data":{}}}')
          NEEDS_FIX=$(echo "$CURRENT_JSON" | python3 -c "
          import json,sys
          d = json.load(sys.stdin)['data']['data']
          print('yes' if not d.get('TELEGRAM_BOT_TOKEN') or not d.get('TELEGRAM_CHAT_ID') else 'no')
          ")
          if [ "$NEEDS_FIX" != "yes" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID ya tienen valor real en Vault -- sin cambios."
            exit 0
          fi
          echo "::warning::secret/jenkins tenía TELEGRAM_BOT_TOKEN y/o TELEGRAM_CHAT_ID vacíos -- restaurando desde los GitHub Actions Secrets de este repo (merge completo, sin tocar ningún otro campo)."
          MERGED_JSON=$(echo "$CURRENT_JSON" | TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" TELEGRAM_CHAT_ID="$TELEGRAM_CHAT_ID" python3 -c "
          import json, os, sys
          current = json.load(sys.stdin)['data']['data']
          current['TELEGRAM_BOT_TOKEN'] = os.environ['TELEGRAM_BOT_TOKEN']
          current['TELEGRAM_CHAT_ID'] = os.environ['TELEGRAM_CHAT_ID']
          print(json.dumps(current))
          ")
          echo "$MERGED_JSON" > /tmp/.merged-secret-jenkins.json
          docker cp /tmp/.merged-secret-jenkins.json vault:/tmp/merged-secret-jenkins.json
          docker exec -u root vault chown vault:vault /tmp/merged-secret-jenkins.json
          docker exec -e VAULT_TOKEN="$TOKEN" vault vault kv put secret/jenkins @/tmp/merged-secret-jenkins.json >/dev/null
          docker exec -u root vault rm -f /tmp/merged-secret-jenkins.json
          rm -f /tmp/.merged-secret-jenkins.json
          echo "OK: TELEGRAM_BOT_TOKEN/CHAT_ID restaurados en Vault (merge completo, ningún otro campo tocado)."

      # Ticket 004 (HU-1 completa): GITHUB_PAT/SONAR_TOKEN/TELEGRAM_* de
      # Jenkins, renderizados DESDE Vault (secret/jenkins) en cada
      # corrida -- a partir de este ticket, Vault es la fuente de
      # verdad (no el archivo). Usa el AppRole "jenkins-infra" (mismo
      # que usa vars/corePipeline.groovy en cada deploy -- solo lectura,
      # ver deploy/vm-infra/vault/bootstrap-jenkins-approle.sh), leyendo
      # su SecretID del propio .env que este mismo paso mantiene. Si
      # Vault no está disponible o el AppRole/secreto no existen
      # todavía, se omite sin tocar el archivo (rollback real, HU-4) --
      # el paso siguiente (auto-generación de SONAR_TOKEN) sigue
      # funcionando como red de seguridad de PRIMERA VEZ si esto se
      # omite y el .env quedó sin SONAR_TOKEN.
      - name: Sincronizar secretos de Jenkins desde Vault (GITHUB_PAT/SONAR_TOKEN/Telegram)
        run: |
          ENVFILE=/home/ubuntu/secrets/jenkins/.env
          JENKINS_ROLE_ID="36a9755d-af3c-c050-2b78-5126cc829791"
          JENKINS_SECRET_ID=$(grep -m1 '^VAULT_JENKINS_SECRET_ID=' "$ENVFILE" | cut -d= -f2-)
          if [ -z "$JENKINS_SECRET_ID" ]; then
            echo "VAULT_JENKINS_SECRET_ID vacío todavía (ver deploy/vm-infra/vault/bootstrap-jenkins-approle.sh) -- se omite este paso."
            exit 0
          fi
          LOGIN_OUT=$(docker exec vault vault write -format=json auth/approle/login \
            role_id="$JENKINS_ROLE_ID" secret_id="$JENKINS_SECRET_ID" 2>/dev/null || echo "")
          TOKEN=$(echo "$LOGIN_OUT" | python3 -c "import json,sys; print(json.load(sys.stdin)['auth']['client_token'])" 2>/dev/null || echo "")
          if [ -n "$TOKEN" ]; then echo "::add-mask::$TOKEN"; fi
          if [ -z "$TOKEN" ]; then
            echo "Vault no alcanzable/sellado -- se omite, el .env existente queda intacto (rollback real, HU-4)."
            exit 0
          fi
          SECRET_JSON=$(docker exec -e VAULT_TOKEN="$TOKEN" vault vault kv get -format=json secret/jenkins 2>/dev/null || echo "")
          if [ -z "$SECRET_JSON" ]; then
            echo "secret/jenkins no existe todavía en Vault -- se omite (nada que sincronizar aún)."
            exit 0
          fi
          # Hallazgo real (ticket 006, ver docs/ARQUITECTURA.md): ningún
          # secreto leído de Vault en runtime pasaba por el mecanismo de
          # enmascarado de logs de GitHub Actions (ese mecanismo solo
          # cubre valores registrados vía "secrets.*" del propio workflow
          # -- nada de lo que se lee aquí, en tiempo de ejecución, desde
          # Vault, calificaba). "::add-mask::" registra cada valor ante
          # el runner en cuanto se lee, para el resto del job completo --
          # mitigación de defensa en profundidad, independiente de la
          # causa raíz puntual del leak real (ver
          # docker-entrypoint-wrapper.sh/Dockerfile para esa causa raíz).
          for VAR in GITHUB_PAT SONAR_TOKEN TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID GITHUB_APP_ID; do
            VALUE=$(echo "$SECRET_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin)['data']['data'].get('$VAR',''))")
            if [ -n "$VALUE" ]; then
              echo "::add-mask::$VALUE"
              if grep -q "^${VAR}=" "$ENVFILE"; then
                sed -i "s#^${VAR}=.*#${VAR}=${VALUE}#" "$ENVFILE"
              else
                printf '%s=%s\n' "$VAR" "$VALUE" >> "$ENVFILE"
              fi
            fi
          done
          # Ticket 006: GITHUB_APP_PRIVATE_KEY_B64 -- la llave de la
          # GitHub App, codificada en base64 (una sola línea) antes de
          # escribirla en el .env. Vault guarda el PEM real
          # (multilínea); codificarla aquí, justo antes de escribir el
          # .env línea-por-línea, evita el hallazgo real de Docker
          # Compose rompiendo su propio YAML con un valor multilínea
          # (ver docker-entrypoint-wrapper.sh, que la decodifica de
          # vuelta dentro del contenedor).
          APPKEY_B64=$(echo "$SECRET_JSON" | python3 -c "import json,sys,base64; key = json.load(sys.stdin)['data']['data'].get('GITHUB_APP_PRIVATE_KEY',''); print(base64.b64encode(key.encode()).decode() if key else '')")
          if [ -n "$APPKEY_B64" ]; then
            echo "::add-mask::$APPKEY_B64"
            if grep -q '^GITHUB_APP_PRIVATE_KEY_B64=' "$ENVFILE"; then
              sed -i "s#^GITHUB_APP_PRIVATE_KEY_B64=.*#GITHUB_APP_PRIVATE_KEY_B64=${APPKEY_B64}#" "$ENVFILE"
            else
              printf 'GITHUB_APP_PRIVATE_KEY_B64=%s\n' "$APPKEY_B64" >> "$ENVFILE"
            fi
          fi
          echo "Secretos de Jenkins sincronizados desde Vault (valores no impresos)."

      # SONAR_TOKEN de Jenkins: red de seguridad de PRIMERA VEZ (Vault
      # recién instalado, todavía sin secret/jenkins) -- se genera solo
      # (vía la API de SonarQube, usando el SONAR_TOKEN de admin que ya
      # vive en los secrets del repo/org) si el paso de arriba no dejó
      # ninguno puesto. Idempotente.
      - name: Asegurar SONAR_TOKEN de Jenkins en /home/ubuntu/secrets/jenkins/.env (si falta)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ENVFILE=/home/ubuntu/secrets/jenkins/.env
          if ! grep -q '^SONAR_TOKEN=.\+' "$ENVFILE"; then
            NEW_TOKEN=$(curl -sS -u "${SONAR_TOKEN}:" -X POST "${SONAR_HOST_URL}/api/user_tokens/generate" \
              --data-urlencode "name=jenkins-ci-$(date +%s)" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
            if [ -z "$NEW_TOKEN" ]; then
              echo "No se pudo generar un token nuevo de SonarQube para Jenkins." >&2
              exit 1
            fi
            sed -i "s#^SONAR_TOKEN=.*#SONAR_TOKEN=${NEW_TOKEN}#" "$ENVFILE"
            echo "SONAR_TOKEN de Jenkins generado y puesto (no impreso)."
          fi

      # Jenkins necesita leer los secrets de cada core para que su
      # Jenkinsfile pueda desplegarlo (mismo patrón de permisos ya
      # documentado en el ticket 049 de auth-core-mc: "leer por grupo"
      # exige también traversal en cada directorio del camino).
      # Generalizado (ticket 002, punto 5): antes hardcodeado solo a
      # auth-core-mc -- ahora itera TODOS los subdirectorios de
      # /home/ubuntu/secrets/ que sean de un proyecto (todo menos
      # "jenkins", que son secrets propios de Jenkins, sin necesidad de
      # acceso de grupo). Un core nuevo (mail-core-mc, etc.) queda
      # cubierto en cuanto Marco cree su carpeta de secrets, sin tocar
      # este workflow.
      - name: Permisos de grupo en los secrets de cada proyecto (para Jenkins)
        run: |
          chmod 710 /home/ubuntu/secrets 2>/dev/null || true
          for dir in /home/ubuntu/secrets/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            [ "$name" = "jenkins" ] && continue
            chmod 750 "$dir" 2>/dev/null || true
            chmod 640 "$dir"/.env.* 2>/dev/null || true
          done

      # Ticket 002, punto 1 (hallazgo real del primer push de este repo,
      # ver docs/ARQUITECTURA.md: recrear Jenkins mató en seco un build de
      # gradle en curso de auth-core-mc). Cualquier "docker compose ... up
      # -d" de Jenkins de abajo PUEDE recrear el contenedor aunque no haya
      # cambiado Dockerfile/plugins.txt (basta con que cambie algo de su
      # config real, p.ej. la ruta absoluta del bind mount de casc/ --
      # exactamente lo que pasó). Antes de tocar el contenedor, se espera
      # a que Jenkins NO tenga ningún paso "sh" ejecutando un proceso de
      # verdad ahora mismo -- sin usar la API HTTP de Jenkins (que exige
      # login, gestionado 100% por UI desde el ticket 049, sin credencial
      # disponible aquí).
      #
      # Iteración real de este mecanismo, verificada en vivo (no solo en
      # el código, ver docs/ARQUITECTURA.md): la primera versión leía
      # <result> en el build.xml de cada build, asumiendo que solo
      # aparece al terminar -- FALSO en esta versión de Jenkins, aparece
      # (con valor SUCCESS por default) desde el primer instante del
      # build, volviendo el chequeo un no-op. Tampoco basta con el mtime
      # del log: "./gradlew test" no imprime nada mientras corren los
      # tests (más de 100s de silencio observados en un build real), así
      # que un umbral de "sin output reciente" también da falso negativo
      # a mitad de un build genuinamente activo.
      #
      # Señal real que sí funciona (confirmada en vivo, aparece exacto al
      # iniciar un paso "sh" y desaparece exacto al terminar, sin importar
      # si produce output): el directorio de control que el plugin
      # durable-task crea por cada paso "sh" en ejecución
      # (<workspace-o-subdir>@tmp/durable-<id>/) -- estado interno del
      # plugin, no del log ni del build.xml, así que no depende de qué
      # tan silencioso sea el comando. No existe durante un "input"
      # pausado (como el gate de prod, hasta 7 días) ni durante
      # waitForQualityGate -- ninguno de los dos sostiene un proceso real
      # que una recreación del contenedor pudiera matar (son estado CPS
      # puro, sobreviven un restart de Jenkins), así que correctamente NO
      # bloquean la recreación.
      - name: Esperar si Jenkins tiene un paso "sh" activo antes de recrearlo
        run: |
          if ! docker ps --format '{{.Names}}' | grep -qx jenkins; then
            echo "Jenkins no está corriendo todavía (primer bootstrap) -- nada que esperar."
            exit 0
          fi
          MAX_WAIT=600
          WAITED=0
          while true; do
            ACTIVE=$(docker exec jenkins sh -c "find /var/jenkins_home/jobs -type d -name 'durable-*' -path '*@tmp*' 2>/dev/null" | head -1)
            if [ -z "$ACTIVE" ]; then
              echo "Sin ningún paso 'sh' activo -- seguro recrear Jenkins si hace falta."
              break
            fi
            if [ "$WAITED" -ge "$MAX_WAIT" ]; then
              echo "::warning::Paso 'sh' activo ($ACTIVE) tras ${MAX_WAIT}s de espera -- se procede de todas formas (excepción conocida, no un silencio: un paso real no debería tardar tanto; si esto se repite, investigar por qué)."
              break
            fi
            echo "Paso 'sh' activo ($ACTIVE) -- esperando 20s antes de reintentar ($WAITED/${MAX_WAIT}s)..."
            sleep 20
            WAITED=$((WAITED + 20))
          done

      # Reconstruye la imagen de Jenkins solo cuando algo que de verdad la
      # define (Dockerfile o plugins.txt) cambió, comparando contra un
      # hash guardado fuera del checkout -- evita recrear/reiniciar
      # Jenkins en cada push (hallazgo real de auth-core-mc, ticket 049).
      #
      # Ticket 006: este paso es el que recrea el contenedor de Jenkins
      # con GITHUB_APP_PRIVATE_KEY_B64 nuevo cuando cambia -- disparado a
      # propósito para la verificación real de la llave nueva de la
      # GitHub App (ver docs/ARQUITECTURA.md).
      - name: Jenkins (orquestador del pipeline, compartido de la VM)
        run: |
          # Hallazgo real (ticket 006, reproducido con una llave RSA falsa
          # antes de tocar la real -- ver docs/ARQUITECTURA.md): un valor
          # multilínea sin comillas escrito alguna vez en este .env (p.ej.
          # una versión vieja/con bug de "Sincronizar secretos de Jenkins
          # desde Vault" que escribiera GITHUB_APP_PRIVATE_KEY crudo en vez
          # de solo la variante _B64) rompe por completo este "source":
          # bash interpreta cada línea del cuerpo del PEM como un comando
          # nuevo -- "command not found" (exit 127), abortando el step
          # aquí mismo (por el "-e" del shell de GitHub Actions) ANTES de
          # llegar siquiera a "docker compose up", e IMPRIMIENDO al menos
          # un fragmento real de la llave en un log público en el proceso.
          # El código actual ya NO escribe esa clave cruda (ver
          # "Sincronizar secretos de Jenkins desde Vault" más arriba, solo
          # escribe GITHUB_APP_PRIVATE_KEY_B64) -- esto es una barrera
          # defensiva adicional, no el mecanismo real: si por cualquier
          # motivo futuro ese artefacto vuelve a aparecer en el .env, se
          # detecta y se quita ANTES de sourcearlo, con un aviso (nunca el
          # valor) en vez de abortar el step imprimiendo fragmentos.
          ENVFILE=/home/ubuntu/secrets/jenkins/.env
          if grep -q '^GITHUB_APP_PRIVATE_KEY=' "$ENVFILE" 2>/dev/null; then
            echo "::warning::Entrada cruda GITHUB_APP_PRIVATE_KEY= (no _B64) encontrada en $ENVFILE -- artefacto inesperado, se elimina (línea completa + cuerpo del PEM hasta su propio END) antes de sourcear el archivo (nunca debería escribirse así, ver docker-entrypoint-wrapper.sh)."
            sed -i '/^GITHUB_APP_PRIVATE_KEY=/,/-----END PRIVATE KEY-----/d' "$ENVFILE"
          fi
          set -a
          . "$ENVFILE"
          set +a
          export DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
          export UBUNTU_GID=$(id -g ubuntu)

          HASH_FILE=/home/ubuntu/secrets/jenkins/.image-inputs-hash
          NEW_HASH=$(sha256sum deploy/vm-infra/jenkins/Dockerfile deploy/vm-infra/jenkins/plugins.txt deploy/vm-infra/jenkins/docker-entrypoint-wrapper.sh | sha256sum | cut -d' ' -f1)
          if [ -f "$HASH_FILE" ] && [ "$(cat "$HASH_FILE")" = "$NEW_HASH" ]; then
            echo "Dockerfile/plugins.txt de Jenkins sin cambios -- 'up -d' sin --build (evita recrear/reiniciar Jenkins en cada push; docker compose igual recrea el contenedor si algo de su config SÍ cambió, p.ej. un GID o un secret nuevo)."
            docker compose -f deploy/vm-infra/jenkins/docker-compose.yml up -d
          else
            echo "Dockerfile/plugins.txt de Jenkins cambiaron (o es la primera corrida) -- reconstruyendo imagen."
            docker compose -f deploy/vm-infra/jenkins/docker-compose.yml up -d --build
            echo "$NEW_HASH" > "$HASH_FILE"
          fi

      # Ticket 002 (fix real, 2026-09-01): imagen que la Shared Library
      # usa (vía docker.sock) para ejecutar comandos en el namespace del
      # HOST desde un paso de pipeline de Jenkins -- necesario porque
      # Jenkins mismo corre containerizado y no tiene acceso directo a
      # /etc/nginx ni al systemd reales de la VM (ver comentario completo
      # en deploy/vm-infra/jenkins/host-exec/Dockerfile). Build local, sin
      # cache-check dedicado (la imagen es mínima, "docker build" con
      # cache de capas ya la vuelve prácticamente gratis cuando no
      # cambió) -- no hay contenedor de larga vida que recrear, así que
      # el riesgo del punto 1 no aplica aquí.
      - name: Imagen "host-exec" (nsenter hacia el host, para pasos de pipeline que lo necesiten)
        run: docker build -t platform-host-exec:latest deploy/vm-infra/jenkins/host-exec

      # El step "Quality Gate" del Jenkinsfile de cada core
      # (waitForQualityGate()) necesita que SonarQube avise a Jenkins
      # cuando termina un análisis -- eso es un webhook configurado DEL
      # LADO DE SONAR, no del lado de Jenkins. Idempotente (busca por
      # nombre antes de crear).
      - name: Webhook de SonarQube -> Jenkins (para el Quality Gate)
        run: |
          SONAR_HOST_URL_LOCAL="http://127.0.0.1:9000"
          SONAR_TOKEN=$(grep '^SONAR_TOKEN=' /home/ubuntu/secrets/jenkins/.env | cut -d= -f2-)
          if [ -n "${SONAR_TOKEN:-}" ]; then echo "::add-mask::$SONAR_TOKEN"; fi
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "SONAR_TOKEN vacío en el .env de Jenkins -- se omite (Marco todavía no lo llenó)." >&2
            exit 0
          fi
          EXISTS=$(curl -s -u "${SONAR_TOKEN}:" "${SONAR_HOST_URL_LOCAL}/api/webhooks/list" | grep -c '"name":"jenkins"' || true)
          if [ "$EXISTS" = "0" ]; then
            curl -s -u "${SONAR_TOKEN}:" -X POST "${SONAR_HOST_URL_LOCAL}/api/webhooks/create" \
              --data-urlencode "name=jenkins" \
              --data-urlencode "url=http://jenkins:8080/sonarqube-webhook/"
          fi

      # Ticket 004 -- hallazgo real: hasta este ticket, TELEGRAM_BOT_TOKEN/
      # TELEGRAM_CHAT_ID no existían como GitHub Actions Secrets de este
      # repo (confirmado con la API, total_count: 0) -- este "curl" sin
      # -f y sin revisar la respuesta terminaba en exit 0 igual (Telegram
      # respondía 404 a una URL con el token vacío), así que este step se
      # veía verde en CADA run desde el ticket 001 sin que el mensaje
      # llegara nunca de verdad. Ahora sí revisa el código HTTP real y el
      # campo "ok" de la respuesta -- falla visible si la notificación no
      # se entrega.
      - name: Notify success (Telegram)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*✅ [platform] infra-sync OK*\nTraefik/SonarQube/Jenkins/Portainer al día en %s (%s).\n%s' "${{ github.ref_name }}" "${{ github.sha }}" "$RUN_URL")
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          OK=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('ok', False))" 2>/dev/null || echo "False")
          if [ "$HTTP_CODE" != "200" ] || [ "$OK" != "True" ]; then
            echo "::error::No se pudo entregar la notificación de éxito a Telegram (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          echo "Notificación de éxito entregada de verdad (HTTP $HTTP_CODE)."

      - name: Notify failure (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG=$(printf '*🔴 [platform] infra-sync FALLÓ*\nFalló en %s (%s).\n%s' "${{ github.ref_name }}" "${{ github.sha }}" "$RUN_URL")
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=Markdown" \
            --data-urlencode "text=$MSG")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          OK=$(echo "$BODY" | python3 -c "import json,sys; print(json.load(sys.stdin).get('ok', False))" 2>/dev/null || echo "False")
          if [ "$HTTP_CODE" != "200" ] || [ "$OK" != "True" ]; then
            echo "::error::No se pudo entregar la notificación de fallo a Telegram (HTTP $HTTP_CODE): $BODY"
            exit 1
          fi
          echo "Notificación de fallo entregada de verdad (HTTP $HTTP_CODE)."
