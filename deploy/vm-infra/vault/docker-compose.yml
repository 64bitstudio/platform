# Ticket platform/003 -- Vault Community Edition ("Vault OSS" en el
# documento de definición: HashiCorp renombró la edición gratuita
# self-hosted de "OSS" a "Community Edition" en 2023, mismo producto,
# mismo alcance -- KV, Transit, AppRole, todo lo que este documento usa;
# ver docs/definiciones/vault-secrets-manager-vm.md). Infra COMPARTIDA de
# la VM, mismo patrón que Traefik/SonarQube/Jenkins/Portainer -- storage
# backend Raft integrado (single-node), auto-unseal vía OCI KMS (ver
# ./config/vault.hcl para el porqué completo de cada opción).
#
# Ticket platform/007 (retiro del Vault local de la Mac de Marco):
# se agregan labels de Traefik + red "edge" -- Vault SÍ se expone ahora a
# internet, en vault.64bitstudio.com, para que el desarrollo local en la
# Mac de Marco pueda usar el motor Transit sin depender de un Vault local
# propio. Ver nginx/vault.conf para el diseño completo de la exposición
# (allowlist de rutas + rate limiting en vez de Basic Auth compartido, y
# por qué) y docs/ARQUITECTURA.md ticket 007 para el registro del VoBo de
# Marco antes de aplicar esto de forma definitiva. El puerto 8200 sigue
# también publicado solo en 127.0.0.1 (uso administrativo directo desde la
# propia VM) y alcanzable desde la red interna "vm-infra" (Jenkins, el
# backend de auth-core-mc en DEV/QA/PROD -- ese tráfico sigue siendo
# 100% interno, nunca pasa por este subdominio público).
name: vm-infra-vault

services:
  vault:
    image: hashicorp/vault:2.0.4
    container_name: vault
    restart: unless-stopped
    # Sin cap_add: IPC_LOCK a propósito -- la imagen oficial 2.0+ ya no la
    # soporta (ver comentario "Vault 2.0+" en vault.hcl); disable_mlock =
    # true en la config es el reemplazo recomendado por HashiCorp para
    # contenedores, y sin swap habilitado en esta VM (Swap: 0B, `free -h`
    # verificado) el riesgo real que mlock() mitigaría no aplica aquí.
    environment:
      VAULT_ADDR: "http://127.0.0.1:8200"
    volumes:
      - ./config/vault.hcl:/vault/config/vault.hcl:ro
      - vault_file:/vault/file
      - vault_logs:/vault/logs
    # Sin "-config=..." explícito: el entrypoint oficial ya arma
    # "vault server -config=/vault/config" por default cuando el primer
    # argumento es "server" -- agregar un -config redundante aquí duplica
    # el flag sin necesidad (Vault simplemente usa el último).
    command: ["server"]
    ports:
      # Solo loopback -- mismo patrón que SonarQube/Jenkins en
      # 127.0.0.1: acceso administrativo de Marco vía SSH a la VM (CLI de
      # vault o un túnel), nunca expuesto directo a internet.
      - "127.0.0.1:8200:8200"
    expose:
      # Puerto de cluster de Raft (ver vault.hcl, cluster_addr) -- SOLO
      # entre contenedores de la misma red, nunca publicado al host ni a
      # internet. No hace falta esto para que otros contenedores de
      # "vm-infra" lo alcancen (Docker ya permite tráfico entre
      # contenedores de la misma red sin publicar el puerto) -- se deja
      # explícito solo por documentación, para que quede claro que este
      # puerto existe y por qué (single-node hoy, pero Raft siempre
      # necesita su propio transporte de cluster, ver el hallazgo real en
      # vault.hcl).
      - "8201"
    networks:
      - default
      - vm-infra
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.vault.rule=Host(`vault.64bitstudio.com`)"
      - "traefik.http.routers.vault.entrypoints=web"
      - "traefik.http.services.vault.loadbalancer.server.port=8200"

networks:
  vm-infra:
    external: true
  edge:
    external: true

volumes:
  vault_file:
  vault_logs:
