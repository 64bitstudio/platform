# Ticket platform/007 -- vhost de nginx para exponer el motor Transit de
# Vault (ya instalado en la VM desde el ticket platform/003) a desarrollo
# local en la Mac de Marco, reemplazando el Vault local de `~/dev-infra`
# que se retira en ese mismo ticket (ver auth-core-mc/docs/ARQUITECTURA.md
# y platform/docs/ARQUITECTURA.md, ticket 007, para el análisis completo).
#
# Mismo patrón de transporte que el resto de la infra (auth-core-mc.conf/
# jenkins.conf/vm-admin-tools.conf): nginx en 80/443 (TLS de Let's Encrypt,
# certbot añade el bloque 443/ssl + redirect) reenvía a Traefik puertas
# adentro (127.0.0.1:8000), que resuelve el contenedor real por el header
# Host (ver deploy/vm-infra/vault/docker-compose.yml, labels de Traefik
# nuevas de este ticket).
#
# DIFERENCIA DELIBERADA frente a sonarqube/traefik/portainer
# (vm-admin-tools.conf): este vhost NO va detrás de Basic Auth compartido.
# Vault ya tiene su propio sistema de autenticación (AppRole, RoleID +
# SecretID de vida corta) diseñado específicamente para exposición
# controlada -- sumarle una capa de credencial compartida encima (un solo
# usuario/password de htpasswd) no añade protección real (quien tenga
# RoleID+SecretID válidos ya tiene lo que necesita; quien no los tenga,
# Basic Auth solo lo detiene un paso más, no lo detiene del problema real)
# y sí reintroduce exactamente el patrón de "credencial única que abre
# todo lo de detrás" que AppRole fue diseñado para evitar -- folclore de
# "más capas siempre es mejor" sin una amenaza real que esa capa
# adicional cierre aquí.
#
# En su lugar, DOS controles reales e independientes del propio auth de
# Vault (defensa en profundidad genuina, no decorativa):
#
# (1) ALLOWLIST DE RUTAS: el único consumidor legítimo de este vhost es
#     desarrollo local (el backend desplegado en DEV/QA/PROD habla con
#     Vault por la red interna "vm-infra", nunca por este subdominio
#     público -- ver deploy/docker-compose.*.yml, VAULT_ADDR ahí sigue
#     siendo "http://vault:8200" interno). Ese consumidor solo necesita 3
#     operaciones exactas: login AppRole + encrypt/decrypt sobre UNA llave
#     de Transit. Se reenvían solo esas 3 rutas, cada una con "location ="
#     (match exacto, no prefijo) -- todo lo demás (la UI de Vault, todo
#     "sys/*" -- sellado, salud, versión, mounts --, cualquier otro método
#     de auth, cualquier otro secreto KV de infra, cualquier otra llave de
#     Transit que se cree a futuro) responde 404 en nginx SIN llegar
#     siquiera a Vault. Esto es una segunda capa real e independiente de
#     la policy de Vault (que ya bloquea todo esto también, ver
#     bootstrap-auth-core-mc-*-approle.sh) -- reduce lo que un scanner
#     externo puede tocar o usar para hacer fingerprinting de versión/
#     topología, sin depender de que la policy de Vault nunca tenga un bug.
#
# (2) RATE LIMITING sobre el único endpoint de autenticación expuesto (ver
#     /etc/nginx/conf.d/rate-limits.conf) -- encarece un intento de fuerza
#     bruta/credential-stuffing contra el login, defensa barata aunque la
#     entropía del SecretID ya lo haga inviable en la práctica.
#
# VoBo explícito de Marco requerido y confirmado antes de que este vhost
# se aplique de forma definitiva en la VM (superficie de ataque nueva
# real) -- ver docs/ARQUITECTURA.md, ticket 007, para el registro de esa
# confirmación.
server {
    listen 80;
    listen [::]:80;
    server_name vault.64bitstudio.com;

    location = /v1/auth/approle/login {
        limit_req zone=vault_login burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/transit/encrypt/auth-core-mc-tenant-keys {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /v1/transit/decrypt/auth-core-mc-tenant-keys {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cualquier otra ruta (UI, sys/*, otros secretos, otras llaves) -- 404
    # sin reenviar nada a Traefik/Vault. A propósito NO "deny all" (que
    # devolvería 403, confirmando que algo existe ahí) -- 404 no distingue
    # "ruta bloqueada" de "esto no existe".
    location / {
        return 404;
    }
}
