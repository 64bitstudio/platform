# Ticket 050 (Portainer + subdominios): vhost de nginx para las 3
# herramientas de infra de mayor privilegio de la VM -- SonarQube,
# dashboard de Traefik, Portainer. Infra COMPARTIDA (no específica de
# auth-core-mc), mismo criterio que jenkins.conf/auth-core-mc.conf: nginx
# en 80/443 reenvía a Traefik puertas adentro (127.0.0.1:8000), que
# resuelve el contenedor real por el header Host. Ver
# docs/ARQUITECTURA.md ticket 050.
#
# A diferencia de auth.*/jenkins.*, estos 3 quedan además detrás de Basic
# Auth de nginx (auth_basic) -- decisión explícita de Marco: son
# superficies de control total sobre Docker/CI/análisis de código de la
# VM, así que se protegen con una capa extra frente a escáneres/bots de
# internet antes de siquiera llegar al login propio de cada herramienta.
# Un solo usuario compartido, hash en /etc/nginx/secrets/ -- fuera del
# repo, mismo espíritu que /home/ubuntu/secrets/jenkins/.env (secreto
# fuera de git), pero NO bajo /home/ubuntu/secrets/: ese árbol es
# alcanzable por Docker vía bind-mount (Jenkins lo lee como contenedor,
# con su propio UID/GID mapeado -- ver ci.yml, "Permisos de grupo en los
# secrets de cada proyecto"), pero nginx corre como el usuario de sistema
# "www-data", SIN membresía en el grupo "ubuntu" y SIN acceso de
# traversal a /home/ubuntu (permisos 750) -- abrir esos permisos a nivel
# de todo /home/ubuntu para que www-data pase es un cambio de alcance
# mucho más amplio del necesario. /etc/nginx/secrets/ es el árbol nativo
# que nginx (root:root, mundo-legible en 644, patrón estándar de
# htpasswd) ya puede leer sin tocar nada fuera de su propia jerarquía.
#
# Certificado real de Let's Encrypt ya emitido para los 3 (ver
# docs/ARQUITECTURA.md ticket 050) -- bloque 443/ssl + redirect 80->443
# agregados por certbot, no a mano (mismo patrón que auth-core-mc.conf/
# jenkins.conf).
server {
    listen 80;
    listen [::]:80;
    server_name sonarqube.64bitstudio.com traefik.64bitstudio.com portainer.64bitstudio.com;

    auth_basic "Acceso restringido -- infra 64bitstudio";
    auth_basic_user_file /etc/nginx/secrets/vm-admin-tools.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Traefik dashboard y Portainer usan WebSockets (logs en vivo,
        # consola de contenedores) -- mismo motivo que jenkins.conf.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
