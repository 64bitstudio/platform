# Ticket 049 (pivote GH Actions -> Jenkins): vhost de nginx para Jenkins
# -- infra COMPARTIDA de la VM (no específica de auth-core-mc, por eso es
# un archivo separado de auth-core-mc.conf). Mismo patrón que ese archivo:
# reenvía a Traefik (127.0.0.1:8000), que resuelve el contenedor real por
# el header Host. Ver docs/ARQUITECTURA.md ticket 049.
#
# Solo HTTP por ahora — falta el registro DNS de jenkins.64bitstudio.com
# (pendiente de que Marco lo cree, mismo patrón que los subdominios de
# auth-core-mc) y correr certbot una vez resuelva.
server {
    listen 80;
    listen [::]:80;
    server_name jenkins.64bitstudio.com;

    # Jenkins puede enviar payloads de build grandes (consola de jobs,
    # etc.) -- default de nginx (1m) es corto para eso.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # Jenkins usa WebSockets para la consola de builds en vivo.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
