# Ticket platform/007 (exponer Vault para desarrollo local -- ver
# docs/ARQUITECTURA.md ticket 007 para el análisis completo). Zona de rate
# limiting a nivel http{} -- "limit_req_zone" solo puede declararse ahí, no
# dentro de un "server{}" -- por eso vive en un archivo propio bajo
# /etc/nginx/conf.d/ (incluido automáticamente por nginx.conf vía
# "include /etc/nginx/conf.d/*.conf;", confirmado en la VM), separado de
# los vhosts de /etc/nginx/sites-enabled/.
#
# Único consumidor hoy: el único endpoint de autenticación que
# vault.64bitstudio.com expone públicamente (/v1/auth/approle/login, ver
# nginx/vault.conf) -- encarece un intento de fuerza bruta/credential-
# stuffing contra ese endpoint aunque el SecretID ya tenga entropía
# suficiente (UUID v4, 122 bits) para que la fuerza bruta sea inviable en
# la práctica; defensa en profundidad barata, no la protección principal.
# 60 req/min (1r/s) por IP, ráfaga de 20 sin demora adicional (nodelay).
# VaultTransitEncryptor hace login EN CADA wrap/unwrap (no cachea token,
# ver su Javadoc) -- un límite demasiado bajo (p.ej. 5r/m) rompería el
# uso real de un solo desarrollador corriendo varias operaciones seguidas
# (pruebas de integración, configurar varios secretos de tenant seguidos).
# 60r/m sigue siendo irrelevante para un ataque de fuerza bruta real
# contra un SecretID de 122 bits de entropía (inviable en cualquier rango
# de tiempo con o sin este límite) -- el valor está calibrado para no
# generar fricción real en desarrollo, no para "ser lo más restrictivo
# posible" sin razón.
limit_req_zone $binary_remote_addr zone=vault_login:10m rate=60r/m;
