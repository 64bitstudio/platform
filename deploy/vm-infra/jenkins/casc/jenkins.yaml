# Ticket 049 (pivote GH Actions -> Jenkins): configuración de Jenkins
# como código (plugin configuration-as-code) — evita dejar el setup
# "hecho a mano" sin rastro. Cubre plugins/credenciales/mensaje del
# sistema (la parte 100% reproducible sin intervención humana). La
# SEGURIDAD (securityRealm/authorizationStrategy) YA NO se gestiona
# aquí — ver el comentario dentro de "jenkins:" más abajo para el
# porqué. El job Multibranch Pipeline en sí se crea una vez, a mano,
# desde la UI de Jenkins (2-3 minutos, ver docs/ARQUITECTURA.md ticket
# 049 para los campos exactos) — hacerlo vía Job DSL aquí era frágil de
# verificar sin poder iterar en vivo contra la UI real, y el riesgo de
# romper el arranque completo de Jenkins por un error de sintaxis en el
# DSL no valía la pena por algo que Marco hace una sola vez.
#
# JENKINS_ADMIN_USER/JENKINS_ADMIN_PASSWORD/GITHUB_PAT vienen del
# entorno del contenedor (ver docker-compose.yml, que los toma de
# /home/ubuntu/secrets/jenkins/.env — NUNCA hardcodeados aquí).
# JENKINS_ADMIN_USER/PASSWORD ya no se consumen en ESTE archivo (la
# seguridad se gestiona por UI, ver más abajo) pero siguen
# necesitándose en docker-compose.yml/el .env para el resto del flujo
# (ci.yml los usa para asegurar el .env la primera vez).
jenkins:
  systemMessage: >
    auth-core-mc / mail-core-mc CI-CD -- gestionado como código
    (deploy/vm-infra/jenkins en el repo de auth-core-mc). Ver
    docs/ARQUITECTURA.md ticket 049.
  numExecutors: 2
  # Hallazgo real (primer arranque de Jenkins, crash-loop): el plugin
  # role-strategy cambió su esquema de JCasC -- "assignments" anidado
  # dentro de cada rol quedó deprecado ("'assignments' is deprecated",
  # Jenkins rechazaba el arranque completo con ConfiguratorException).
  # Se cambió a matrix-auth (plugin más simple y estable, sin ese
  # churn de esquema) -- alcanza de sobra para "un solo admin real".
  #
  # Hallazgo real #2 (ticket 049, PR #78): el esquema `permissions:`
  # (lista plana "Permiso:sid" sin prefijo de tipo) resultó ser el
  # formato DEPRECADO de matrix-auth desde la 3.2 -- se migró a
  # `entries:` (tipado explícito USER:/GROUP:).
  #
  # Hallazgo real #5/#6 (ticket 049, PR #78 -- ver docs/ARQUITECTURA.md
  # para las 5 hipótesis investigadas y su evidencia completa): incluso
  # con `entries:` bien tipado y con los 32 permisos reales de esta
  # instalación otorgados EXPLÍCITAMENTE a marco (no solo
  # Overall/Administer), marco seguía recibiendo 403 "missing the
  # Job/Configure permission" al configurar el job auth-core-mc vía la
  # API de Jenkins -- sin que ninguna de las hipótesis investigadas
  # (caché en memoria, clase legacy del core, esquema deprecado,
  # identidad duplicada, colisión con el plugin role-strategy,
  # la authority FACTOR_PASSWORD de Spring Security 7.1) explicara la
  # causa real. Con VoBo de Marco, se hizo el "break-glass" oficial de
  # Jenkins (desactivar seguridad temporalmente vía la UI, arreglar el
  # admin sin restricciones, reactivar) -- un procedimiento que
  # necesariamente deja el estado de seguridad real vivo solo en el
  # config.xml del propio Jenkins, escrito por la UI en el momento.
  #
  # POR ESO se quitan por completo `securityRealm:` y
  # `authorizationStrategy:` de este archivo: si quedaran declarados
  # aquí, JCasC los reaplicaría en el siguiente arranque del
  # contenedor y DESHARÍA lo que el break-glass acabe de arreglar --
  # volviendo al mismo estado roto que motivó el break-glass. De aquí
  # en adelante, la seguridad de Jenkins (usuarios, permisos) se
  # gestiona 100% a mano desde Manage Jenkins -> Security, NO vía
  # JCasC -- ver docs/ARQUITECTURA.md ticket 049 para el detalle
  # completo de esta decisión y su razón.

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              scope: GLOBAL
              id: "github-pat"
              username: "marco-cortes"
              password: "${GITHUB_PAT:-}"
              description: >
                PAT de GitHub para checkout/webhook/push de Jenkins
                (auth-core-mc + mail-core-mc). Generado por Marco,
                nunca en git -- ver docs/ARQUITECTURA.md ticket 049.
          - string:
              scope: GLOBAL
              id: "sonar-token"
              secret: "${SONAR_TOKEN:-}"
              description: "Token de SonarQube (misma instancia de la VM que ya usaba ci.yml)."
          - string:
              scope: GLOBAL
              id: "telegram-bot-token"
              secret: "${TELEGRAM_BOT_TOKEN:-}"
              description: "Bot de Telegram para notificaciones (opcional)."
          - string:
              scope: GLOBAL
              id: "telegram-chat-id"
              secret: "${TELEGRAM_CHAT_ID:-}"
              description: "Chat de Telegram para notificaciones (opcional)."

unclassified:
  location:
    url: "https://jenkins.64bitstudio.com/"
  sonarGlobalConfiguration:
    installations:
      - name: "sonarqube-vm"
        serverUrl: "${SONAR_HOST_URL:-http://sonarqube:9000}"
        credentialsId: "sonar-token"
