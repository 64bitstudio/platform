# Ticket 049 (rediseño dev/qa/prod) — config estática de Traefik, ingress
# compartido de la VM. Ver docker-compose.yml en este mismo directorio y
# docs/ARQUITECTURA.md ticket 049 para el porqué de cada decisión —
# en particular, por qué Traefik NO maneja TLS/ACME aquí (nginx lo hace,
# por decisión de Marco de mantener nginx como puerta de entrada en vez de
# deshabilitarlo).

entryPoints:
  web:
    address: ":8000"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    # Nada se expone por default con solo conectarse a la red `edge` — cada
    # servicio tiene que declarar "traefik.enable=true" explícitamente (ver
    # las labels en deploy/docker-compose.{dev,qa,prod}.yml). Evita que un
    # contenedor futuro quede enrutado por accidente.
    exposedByDefault: false
    network: edge
    watch: true

# Ticket 050 (Portainer + subdominios): dashboard/API habilitado -- ya hay
# hostname/auth decidido (traefik.64bitstudio.com, detrás de Basic Auth de
# nginx). Deliberadamente SIN "--api.insecure=true": ese flag abre un
# entrypoint HTTP sin autenticación propia en el puerto 8080 del
# contenedor -- innecesario acá porque el router de abajo (ver
# docker-compose.yml, service "api@internal") expone el dashboard por el
# MISMO entrypoint "web" (8000) que ya usa el resto del tráfico, protegido
# por el mismo camino: nginx (Basic Auth + TLS) -> Traefik puertas adentro
# en 127.0.0.1:8000, nunca directo a internet.
api:
  dashboard: true

log:
  level: INFO
