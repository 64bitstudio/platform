# Ticket 049 (rediseño dev/qa/prod): SonarQube pasa de la Mac de Marco a
# esta VM — instancia NUEVA (sin migrar historial/proyectos, decisión
# explícita de Marco: más simple que migrar el volumen de datos). Consecuencia
# directa de mover también aquí el runner que ejecuta `build-test-analyze`:
# la Mac queda dedicada solo a codificar/commits/push, sin ejecutar CI. Ver
# docs/ARQUITECTURA.md ticket 049.
#
# Mismo patrón que ~/dev-infra/docker-compose.yml en la Mac (referencia
# directa) — Postgres solo en la red interna del proyecto, sin publicarse
# al host. Compartido por toda la VM (no específico de auth-core-mc), mismo
# criterio que Traefik en deploy/vm-infra/traefik/ — el ticket gemelo de
# mail-core-mc reusa esta instancia (su propio SONAR_TOKEN, mismo
# SONAR_HOST_URL), no levanta una segunda.
#
# Puerto 9000 publicado SOLO en loopback (127.0.0.1) — a diferencia de la
# app de auth-core-mc, nada necesita alcanzar SonarQube desde fuera de la
# VM; el runner que corre el análisis vive en esta misma máquina.
#
# Ticket 049 (pivote GH Actions -> Jenkins): además conectado a la red
# COMPARTIDA "vm-infra" (distinta de "edge", que es solo para tráfico
# público vía Traefik) — Jenkins corre en un contenedor propio y necesita
# alcanzar a SonarQube por nombre de servicio ("sonarqube:9000"), no por
# localhost (cada contenedor tiene su propio loopback).
#
# Memoria acotada a propósito (heaps de Web/CE moderados, Search — el
# Elasticsearch embebido — en el mínimo recomendado por Sonar) — la VM
# comparte 2 OCPU/12GB con Postfix, los stacks dev/qa/prod, Traefik y el
# runner. Ver docs/ARQUITECTURA.md ticket 049 para el estado de memoria
# real medido tras levantar esto.
#
# Ticket 050 (Portainer + subdominios): además conectado a la red "edge"
# (tráfico público vía Traefik/nginx) con labels de Traefik, para exponer
# sonarqube.64bitstudio.com -- SIN quitar el bind a 127.0.0.1:9000 de
# arriba, que sigue siendo el camino que usa Jenkins/el runner para
# alcanzar Sonar dentro de la VM. El acceso público queda detrás de Basic
# Auth de nginx (ver deploy/vm-infra/nginx/), Sonar mismo sigue pidiendo su
# propio login encima. Ver docs/ARQUITECTURA.md ticket 050.
name: vm-infra-sonarqube

services:
  sonarqube-db:
    image: postgres:16-alpine
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      SONAR_WEB_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_CE_JAVAOPTS: "-Xmx512m -Xms128m"
      SONAR_SEARCH_JAVAOPTS: "-Xmx1g -Xms1g"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 8192
    networks:
      - default
      - vm-infra
      - edge
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=edge"
      - "traefik.http.routers.sonarqube.rule=Host(`sonarqube.64bitstudio.com`)"
      - "traefik.http.routers.sonarqube.entrypoints=web"
      - "traefik.http.services.sonarqube.loadbalancer.server.port=9000"

networks:
  vm-infra:
    external: true
  edge:
    external: true

volumes:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
